<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Cadence Engine</title>
    <style>
        body { background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #joinBtn, #talkBtn { background-color: #8b0000; color: white; border: none; border-radius: 50%; width: 200px; height: 200px; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; }
        #talkBtn { display: none; } /* Hidden until joined */
        #talkBtn:active { background-color: #ff0000; transform: scale(0.95); }
    </style>
</head>
<body>
    <h2>Ten Candles</h2>
    <button id="joinBtn">Join Session</button>
    <button id="talkBtn">Hold to Speak</button>

    <script>
        let ws;
        let audioContext;
        let playContext;
        let nextPlayTime = 0; // The jitter buffer variable for smooth audio
        let processor;
        let mediaStream;

        const joinBtn = document.getElementById("joinBtn");
        const talkBtn = document.getElementById("talkBtn");

        joinBtn.addEventListener("click", async () => {
            // 1. Unlock the audio context with this initial tap
            playContext = new AudioContext({ sampleRate: 24000 });
            if (playContext.state === 'suspended') {
                await playContext.resume();
            }

            // 2. Hide Join button, reveal Talk button
            joinBtn.style.display = "none";
            talkBtn.style.display = "block";

            // 3. Connect to the server dynamically (uses wss for ngrok)
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            // 4. Listen for the GM's greeting and queue audio smoothly
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "reply.audio") {
                    const binaryString = atob(msg.data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const audioData = new Int16Array(bytes.buffer);
                    const float32 = new Float32Array(audioData.length);
                    for (let i = 0; i < audioData.length; i++) {
                        float32[i] = audioData[i] / 32768;
                    }
                    
                    const buffer = playContext.createBuffer(1, float32.length, 24000);
                    buffer.getChannelData(0).set(float32);
                    
                    const source = playContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(playContext.destination);
                    
                    // --- THE JITTER BUFFER LOGIC ---
                    if (nextPlayTime < playContext.currentTime) {
                        nextPlayTime = playContext.currentTime + 0.05; 
                    }
                    source.start(nextPlayTime);
                    nextPlayTime += buffer.duration;
                    // --------------------------------
                }
            };
        });

        // Start recording when the user touches the Talk button
        talkBtn.addEventListener("pointerdown", async (e) => {
            e.preventDefault();
            talkBtn.innerText = "Listening...";
            
            if (!audioContext) audioContext = new AudioContext({ sampleRate: 24000 });
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(2048, 1, 1);
            
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            processor.onaudioprocess = (e) => {
                const float32 = e.inputBuffer.getChannelData(0);
                const int16 = new Int16Array(float32.length);
                for (let i = 0; i < float32.length; i++) {
                    let s = Math.max(-1, Math.min(1, float32[i]));
                    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(int16.buffer)));
                
                // Only send audio if the connection is fully open
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "input.audio", audio: base64 }));
                }
            };
        });

        // Stop recording when the user lifts their finger
        talkBtn.addEventListener("pointerup", (e) => {
            e.preventDefault();
            talkBtn.innerText = "Hold to Speak";
            if (processor) processor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
